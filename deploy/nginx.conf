# Configuration nginx de grizette.fan pour l'instance statique Coolify.
# À coller dans Coolify : application > Configuration > General > « Custom Nginx Configuration »
# (bouton « Generate » pour afficher la config par défaut, puis remplacer par ce contenu),
# puis redéployer (la config est copiée dans l'image au build : un simple redémarrage ne suffit pas).
# Ce fichier est versionné pour référence ; nginx refuse de le servir (voir « Fichiers internes »).

# Anciennes URL d'images (site avant refonte) → nouveaux fichiers identiques.
map $uri $grizette_redirection {
    default "";
    "/grizette/images/grizette.jpg" "/images/Grizette%20(3).jpg";
    "/images/grizette.jpg" "/images/Grizette%20(3).jpg";
    "/images/WhatsApp Image 2026-07-11 at 22.47.50.jpeg" "/images/Grizette%20(1).jpeg";
    "/images/WhatsApp Image 2026-07-14 at 23.23.29.jpeg" "/images/Grizette%20(2).jpeg";
    "/images/1 (1).jpg" "/images/Grizette%20(4).jpg";
    "/images/1 (2).jpg" "/images/Grizette%20(5).jpg";
    "/images/1 (3).jpg" "/images/Grizette%20(6).jpg";
    "/images/1 (4).jpg" "/images/Grizette%20(7).jpg";
    "/images/1 (5).jpg" "/images/Grizette%20(8).jpg";
    "/images/1 (6).jpg" "gone";
    "/images/Grizette (9).jpg" "gone";
    "/photo/grizette-9/" "gone";
    "/photo/grizette-9" "gone";
    "/images/1 (7).jpg" "/images/Grizette%20(10).jpg";
    "/images/1 (8).jpg" "/images/Grizette%20(11).jpg";
    "/images/1 (9).jpg" "/images/Grizette%20(12).jpg";
    "/images/1 (10).jpg" "/images/Grizette%20(13).jpg";
    "/images/1 (11).jpg" "/images/Grizette%20(14).jpg";
    "/images/1 (12).jpg" "/images/Grizette%20(15).jpg";
    "/images/1 (13).jpg" "/images/Grizette%20(16).jpg";
    "/images/1 (14).jpg" "/images/Grizette%20(17).jpg";
    "/images/1 (15).jpg" "/images/Grizette%20(18).jpg";
    "/images/1 (16).jpg" "/images/Grizette%20(19).jpg";
    "/images/1 (17).jpg" "/images/Grizette%20(20).jpg";
    "/images/1 (18).jpg" "/images/Grizette%20(21).jpg";
    "/images/1 (19).jpg" "/images/Grizette%20(22).jpg";
    "/images/1 (20).jpg" "/images/Grizette%20(23).jpg";
    "/images/1 (21).jpg" "/images/Grizette%20(24).jpg";
    "/images/1 (22).jpg" "/images/Grizette%20(25).jpg";
    "/images/1 (23).jpg" "/images/Grizette%20(26).jpg";
    "/images/1 (24).jpg" "/images/Grizette%20(27).jpg";
    "/images/1 (25).jpg" "/images/Grizette%20(28).jpg";
    "/images/1 (26).jpg" "/images/Grizette%20(29).jpg";
    "/images/1 (27).jpg" "/images/Grizette%20(30).jpg";
    "/images/1 (28).jpg" "/images/Grizette%20(31).jpg";
    "/images/1 (29).jpg" "/images/Grizette%20(32).jpg";
    "/images/1 (30).jpg" "/images/Grizette%20(33).jpg";
    "/images/1 (31).jpg" "/images/Grizette%20(34).jpg";
    "/images/1 (32).jpg" "/images/Grizette%20(35).jpg";
    "/images/1 (33).jpg" "/images/Grizette%20(36).jpg";
    "/images/1 (34).jpg" "gone";
    "/images/1 (35).jpg" "/images/Grizette%20(38).jpg";
    "/images/1 (36).jpg" "/images/Grizette%20(39).jpg";
    "/images/1 (37).jpg" "/images/Grizette%20(1).jpg";
    "/images/1 (38).jpg" "/images/Grizette%20(2).jpg";
    "/images/1 (39).jpg" "/images/Grizette%20(3).jpg";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # Redirections relatives : évite un détour par http:// derrière le proxy HTTPS de Coolify.
    absolute_redirect off;

    charset utf-8;
    charset_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    # Anciennes URL : 301 vers le nouveau fichier, 410 pour la photo retirée.
    if ($grizette_redirection = "gone") { return 410; }
    if ($grizette_redirection) { return 301 $grizette_redirection; }

    # Fichiers internes : jamais servis (outils, config, dossier .git éventuel…).
    location ~ ^/(outils|deploy|todo|node_modules)(/|$) { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~ ^/(README\.md|package(-lock)?\.json)$ { return 404; }

    # Vraie page 404 (avec le statut 404, pas un 200 vers l'accueil).
    error_page 404 /404.html;
    location = /404.html { internal; add_header Cache-Control "no-cache" always; }

    # Pages HTML et fichiers pour les robots : toujours revalidés.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # Versions optimisées (nom unique par contenu) et polices/JS versionnés : cache d'un an.
    location ^~ /img/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location ^~ /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /photos.json { add_header Cache-Control "public, max-age=3600"; }
    # Originaux : cache d'une semaine.
    location ^~ /images/ { add_header Cache-Control "public, max-age=604800"; }
    location ~* ^/(favicon\.(svg|ico)|favicon-32\.png|apple-touch-icon\.png|icone-[a-z0-9-]+\.png)$ {
        add_header Cache-Control "public, max-age=604800";
    }
}
